<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="SkillBridge - Academia-Industry Integration Platform bridging the gap between learning and hiring." />
  <title>SkillBridge | Bridge the gap between learning and hiring</title>
  <!-- Local Inter Font Family Preloads (Normal & Italic) -->
  <link rel="preload" href="/fonts/inter/Inter-VariableFont_opsz,wght.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="/fonts/inter/Inter-Italic-VariableFont_opsz,wght.ttf" as="font" type="font/ttf" crossorigin />
  <!-- Tailwind CSS Play CDN for Figma components -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            inter: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            fraunces: ['Inter', 'sans-serif'],
            generalsans: ['Inter', 'sans-serif'],
          },
          colors: {
            background: 'var(--background, #f8fafc)',
            foreground: 'var(--foreground, #0f172a)',
            card: 'var(--card, #ffffff)',
            'card-foreground': 'var(--card-foreground, #0f172a)',
            primary: 'var(--primary, #FF8100)',
            'primary-foreground': 'var(--primary-foreground, #ffffff)',
            muted: 'var(--muted, #f1f5f9)',
            'muted-foreground': 'var(--muted-foreground, #64748b)',
            border: 'var(--border, #e2e8f0)',
          }
        }
    }
  </script>
  <!-- GSAP & ScrollTrigger Animation Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>



<body>
  <div id="root"></div>
  <script type="module" src="/src/entries/landing.jsx"></script>
</body>

</html>
